services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anc
      POSTGRES_PASSWORD: anc
      POSTGRES_DB: anc
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    ports:
      - '4000:4000'

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - '3000:3000'
